<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI中台</title>
<style>
html,body{margin:0;height:100%;background:#f3f7f9;color:#1f3a4d;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
button,input{font:inherit}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.side{background:#145860;color:#e7f6f4;padding:22px 16px}
.side h1{margin:0 0 6px;font-size:18px;font-weight:650}
.side p{margin:0 0 18px;font-size:12px;line-height:1.6;color:#b7ddd8}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{text-align:left;border:0;border-radius:8px;background:transparent;color:#e7f6f4;padding:9px 10px;cursor:pointer}
.nav button.on,.nav button:hover{background:#1e7a72}
.main{padding:22px 26px}
.tag{display:inline-block;background:#e8f6fb;color:#2b8fb6;border:1px solid #b7e0ef;border-radius:999px;padding:3px 10px;font-size:12px}
h2{margin:12px 0 6px;color:#145860;font-size:22px}
.lead{margin:0 0 16px;color:#6a8494;font-size:13px;line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:#fff;border:1px solid #d7e6ee;border-radius:10px;padding:14px;text-align:left;cursor:pointer}
.card b{display:block;margin-bottom:4px}
.card span{font-size:12px;color:#6a8494}
form{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;margin-bottom:14px}
input{border:1px solid #d7e6ee;border-radius:8px;padding:8px 10px;background:#fff}
form button,.row button{border:0;border-radius:8px;background:#14afe7;color:#fff;padding:8px 12px;cursor:pointer}
.row{display:grid;grid-template-columns:140px 1fr auto;gap:10px;align-items:center;background:#fff;border:1px solid #d7e6ee;border-radius:8px;padding:10px 12px;margin-bottom:8px}
.row button{background:#fff;color:#9a4a4a;border:1px solid #ead4d4}
.empty{color:#6a8494;font-size:13px}
@media (max-width:860px){.shell{grid-template-columns:1fr}.grid,form,.row{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <h1>AI中台</h1>
    <p id="meta">独立管理模块。控制台只转发，不在控制台进程里。</p>
    <nav id="nav" class="nav"></nav>
  </aside>
  <main class="main" id="main"></main>
</div>
<script>
const state = { session: null, items: [] }

function base() {
  return location.pathname.endsWith('/') ? location.pathname : location.pathname + '/'
}

function api(path) {
  return base() + path
}

function esc(text) {
  return String(text ?? '').replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]))
}

function current() {
  const code = new URLSearchParams(location.search).get('fn')
  return (state.session.catalog || []).find((item) => item.code === code) || null
}

function go(code) {
  const url = new URL(location.href)
  if (code) url.searchParams.set('fn', code)
  else url.searchParams.delete('fn')
  history.pushState({}, '', url)
  render()
}

async function loadItems() {
  const fn = current()
  if (!fn) {
    state.items = []
    return
  }
  const res = await fetch(api('api/items?fn=' + encodeURIComponent(fn.code)))
  const body = await res.json()
  state.items = body.items || []
}

function renderNav() {
  const fn = current()
  const home = '<button type="button" data-fn="" class="' + (fn ? '' : 'on') + '">中台</button>'
  const rest = state.session.catalog.map((item) =>
    '<button type="button" data-fn="' + esc(item.code) + '" class="' + (fn && fn.code === item.code ? 'on' : '') + '">' + esc(item.name) + '</button>'
  ).join('')
  document.getElementById('nav').innerHTML = home + rest
  document.getElementById('meta').textContent = '企业 ' + state.session.enterId + ' · 门口 ' + state.session.door
}

function renderHub() {
  const cards = state.session.catalog.map((item) =>
    '<button class="card" type="button" data-fn="' + esc(item.code) + '"><b>' + esc(item.name) + '</b><span>' + esc(item.code) + ' · 已开放</span></button>'
  ).join('')
  document.getElementById('main').innerHTML =
    '<span class="tag">本机测试 · 尚未迁云</span><h2>已开放模块</h2>' +
    '<p class="lead">点模块进入。记录按企业分开，存在这台机器上。迁到别的云时，连同这份记录一起搬走，控制台只改下一跳。</p>' +
    '<div class="grid">' + cards + '</div>'
}

function renderFn(fn) {
  const rows = state.items.length
    ? state.items.map((item) =>
      '<div class="row"><b>' + esc(item.left) + '</b><span>' + esc(item.right) + '</span><button type="button" data-id="' + esc(item.id) + '">删除</button></div>'
    ).join('')
    : '<p class="empty">还没有记录。</p>'
  document.getElementById('main').innerHTML =
    '<span class="tag">' + esc(fn.code) + '</span><h2>' + esc(fn.name) + '</h2>' +
    '<p class="lead">这是该模块在中台里的记录，不是控制台工作台。</p>' +
    '<form id="add"><input name="left" placeholder="' + esc(fn.left) + '" required><input name="right" placeholder="' + esc(fn.right) + '" required><button type="submit">记下</button></form>' +
    rows
  document.getElementById('add').onsubmit = async (event) => {
    event.preventDefault()
    const data = new FormData(event.target)
    await fetch(api('api/items?fn=' + encodeURIComponent(fn.code)), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ left: data.get('left'), right: data.get('right') })
    })
    await loadItems()
    render()
  }
}

async function render() {
  renderNav()
  const fn = current()
  if (!fn) renderHub()
  else {
    await loadItems()
    renderFn(fn)
  }
}

document.body.addEventListener('click', async (event) => {
  const fn = event.target.closest('[data-fn]')
  if (fn) {
    go(fn.getAttribute('data-fn'))
    return
  }
  const remove = event.target.closest('[data-id]')
  if (!remove || !current()) return
  await fetch(api('api/items?fn=' + encodeURIComponent(current().code)), {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ op: 'remove', id: remove.getAttribute('data-id') })
  })
  await loadItems()
  render()
})

window.addEventListener('popstate', () => render())

fetch(api('api/session' + location.search)).then((res) => res.json()).then((session) => {
  state.session = session
  const params = new URLSearchParams(location.search)
  if (!params.get('fn') && session.fn) {
    const url = new URL(location.href)
    url.searchParams.set('fn', session.fn)
    history.replaceState({}, '', url)
  }
  return render()
}).catch(() => {
  document.getElementById('main').textContent = '中台进程没有应答'
})
</script>
</body>
</html>
