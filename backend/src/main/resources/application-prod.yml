# 生产档。域名 A 记录只指向网关公网 IP。模块 TARGET_URL 必须是客户 VPC 内网，禁止写公网 IP。
spring:
  datasource:
    url: jdbc:mysql://${GOOCI_DB_HOST}:${GOOCI_DB_PORT:3306}/${GOOCI_DB_NAME:gooci}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=${GOOCI_DB_SSL:false}
    username: ${GOOCI_DB_USER}
    password: ${GOOCI_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql,classpath:db/schema-patch.sql
      encoding: UTF-8
      continue-on-error: true

gooci:
  ext-pdm-url: ${GOOCI_EXT_PDM_URL:}
  ext-pack-url: ${GOOCI_EXT_PACK_URL:}
  seed-demo-modules: false
