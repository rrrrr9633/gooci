# Docker MySQL：仓库根目录执行 infra/docker-compose.yml 后
# mvn spring-boot:run -Dspring-boot.run.profiles=mysql
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:13306/gooci?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: gooci
    password: gooci_pwd
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql,classpath:db/schema-patch.sql
      encoding: UTF-8
      continue-on-error: true
