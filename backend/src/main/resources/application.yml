server:
  port: ${GOOCI_SERVER_PORT:8080}

spring:
  application:
    name: gooci-console
  profiles:
    default: prod
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 8MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: "1"
      logic-not-delete-value: "0"

gooci:
  public-domain: ${GOOCI_PUBLIC_DOMAIN:goocidata.top}
  public-ip: ${GOOCI_PUBLIC_IP:154.201.65.68}
  public-origin: ${GOOCI_PUBLIC_ORIGIN:https://goocidata.top}
  cors-origins: ${GOOCI_CORS_ORIGINS:https://goocidata.top,https://www.goocidata.top,http://goocidata.top,http://www.goocidata.top,http://154.201.65.68}
  jwt-secret: ${GOOCI_JWT_SECRET:gooci-console-dev-secret-change-before-release-2026}
  jwt-expire-hours: ${GOOCI_JWT_EXPIRE_HOURS:12}
  service-phone: ${GOOCI_SERVICE_PHONE:}
  ext-demo-url: ${GOOCI_EXT_DEMO_URL:}
  ext-pdm-url: ${GOOCI_EXT_PDM_URL:}
  ext-pack-url: ${GOOCI_EXT_PACK_URL:}
