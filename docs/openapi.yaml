components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ApiResultVoid:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 1 }
        message: { type: string }
        data: { nullable: true }
    SiteMeta:
      type: object
      required: [brandName, servicePhone]
      properties:
        brandName: { type: string, example: GOOCI 谷器 }
        servicePhone: { type: string, description: 空串表示未配置 }
    ApiResultSiteMeta:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, example: 0 }
        message: { type: string, example: ok }
        data:
          $ref: "#/components/schemas/SiteMeta"
    LoginCommand:
      type: object
      required: [loginName, loginPassword]
      properties:
        loginName: { type: string }
        loginPassword: { type: string }
    MenuView:
      type: object
      properties:
        id: { type: string }
        menuCode: { type: string }
        menuName: { type: string }
        routePath: { type: string }
        iconCode:
          type: string
          nullable: true
          enum: [monitor, office, collection, lock, grid]
        children:
          type: array
          items:
            $ref: "#/components/schemas/MenuView"
    SessionView:
      type: object
      properties:
        token: { type: string, nullable: true, description: 仅登录接口有值 }
        userId: { type: string }
        displayName: { type: string }
        mobile: { type: string, nullable: true, description: 已脱敏 }
        roleName: { type: string }
        enterId: { type: string }
        enterName: { type: string }
        regionText: { type: string }
        certStatus: { type: string, description: "1=已认证" }
        servicePhone: { type: string }
        menus:
          type: array
          items:
            $ref: "#/components/schemas/MenuView"
    ApiResultSession:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          $ref: "#/components/schemas/SessionView"
    ConsoleOverview:
      type: object
      properties:
        unreadMessageCount: { type: integer, example: 0 }
        pendingTaskCount: { type: integer, example: 0 }
        linkedDeviceCount: { type: integer, example: 0 }
        onlineDeviceCount: { type: integer, example: 0 }
        recentMessages:
          type: array
          items:
            $ref: "#/components/schemas/InboxTickerView"
    ApiResultOverview:
      type: object
      properties:
        code: { type: integer }
        message: { type: string }
        data:
          $ref: "#/components/schemas/ConsoleOverview"
    AppGrantView:
      type: object
      properties:
        appCode: { type: string }
        appName: { type: string }
        funcRoleName: { type: string }
        dataRoleName: { type: string }
    ProfileView:
      type: object
      properties:
        displayName: { type: string }
        mobile: { type: string, nullable: true, description: 明文，不做脱敏 }
        mailAddr: { type: string, description: 未填为空串 }
        roleName: { type: string }
        enterName: { type: string }
        deptNames:
