openapi: 3.0.3
info:
  title: GOOCI 控制台 API
  version: 0.1.0
  description: |
    与代码同步的内核接口。业务失败为 HTTP 200 且 code=1。
    未登录访问受保护接口为 HTTP 401。
    外接模块同域入口 GET /ext/{appCode} 出 HTML 壳，不走 /api 信封。
servers:
  - url: http://127.0.0.1:8080
    description: 直连后端
  - url: http://127.0.0.1:5173
    description: Vite 开发代理
tags:
  - name: site
  - name: auth
  - name: console
  - name: profile
  - name: org
  - name: staff
  - name: device
  - name: perm
  - name: biz
  - name: ops
  - name: todo
paths:
  /api/site/meta:
    get:
      tags: [site]
      summary: 官网公开信息
      operationId: getSiteMeta
      security: []
      responses:
        "200":
          description: 信封。成功时 data 含 brandName、servicePhone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultSiteMeta"
              examples:
                ok:
                  value:
                    code: 0
                    message: ok
                    data:
                      brandName: GOOCI 谷器
                      servicePhone: ""
  /api/auth/login:
    post:
      tags: [auth]
      summary: 登录
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCommand"
            example:
              loginName: admin
              loginPassword: GooCi@2026
      responses:
        "200":
          description: 成功返回 SessionView（含 token）；失败 code=1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultSession"
  /api/auth/sms:
    post:
      tags: [auth]
      summary: 发送注册验证码
      operationId: sendSms
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SmsCodeCommand"
      responses:
        "200":
          description: data.demoCode 为演示验证码
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultSms"
  /api/auth/register:
    post:
      tags: [auth]
      summary: 企业或个人注册
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCommand"
      responses:
        "200":
          description: 成功返回 SessionView（含 token）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultSession"
  /api/console/session:
    get:
      tags: [console]
      summary: 当前会话
      operationId: getSession
      security:
        - bearerAuth: []
      responses:
        "200":
          description: SessionView，token 为 null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultSession"
        "401":
          description: 未登录或登录已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultVoid"
              example:
                code: 1
                message: 未登录或登录已过期
                data: null
  /api/console/overview:
    get:
      tags: [console]
      summary: 工作台概览
      operationId: getOverview
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 未读站内信、待办条数来自库；设备数仍为 0
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultOverview"
        "401":
          description: 未登录或登录已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultVoid"
  /api/console/profile:
    get:
      tags: [profile]
      summary: 当前用户个人信息
      operationId: getProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ProfileView。手机号明文，mailAddr 未填为空串
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultProfile"
        "401":
          description: 未登录或登录已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultVoid"
  /api/console/profile/name:
    post:
      tags: [profile]
      summary: 改姓名
      operationId: updateProfileName
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNameCommand"
            example:
              displayName: 管理员
      responses:
        "200":
          description: 成功返回更新后的 ProfileView
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultProfile"
        "401":
          description: 未登录或登录已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultVoid"
  /api/console/profile/mail:
    post:
      tags: [profile]
      summary: 改或清空邮箱
      operationId: updateProfileMail
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMailCommand"
            example:
              mailAddr: ""
      responses:
        "200":
          description: 成功返回更新后的 ProfileView
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultProfile"
        "401":
          description: 未登录或登录已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultVoid"
  /api/console/profile/password:
    post:
      tags: [profile]
      summary: 改登录密码
      operationId: updateProfilePassword
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordCommand"
            example:
              oldPassword: GooCi@2026
              newPassword: GooCi@2026x
      responses:
        "200":
          description: 成功 data 为 null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultVoid"
        "401":
          description: 未登录或登录已过期
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResultVoid"
  /api/console/org/enterprise:
    get:
      tags: [org]
      summary: 企业信息
      operationId: getEnterprise
      security:
        - bearerAuth: []
      responses:
