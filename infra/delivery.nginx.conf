server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
    }

    location = /ext { return 404; }
    location ^~ /ext/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
